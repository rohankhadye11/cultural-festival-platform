# ==============================================================================
# Automated Cultural Festival Schedule Platform (FestPulse)
# Core Application Properties - Phase 1 MVP Configuration
# ==============================================================================

# Application Identity
spring.application.name=cultural-festival-platform

# Embedded Tomcat Web Server Port
server.port=8080

# ------------------------------------------------------------------------------
# PostgreSQL Database Configuration (Placeholder Settings)
# ------------------------------------------------------------------------------
# Note: Update these credentials according to your local or Docker PostgreSQL instance.
# To create the database locally:
#   CREATE DATABASE festival_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/festival_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=FestPulseHikariPool

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate ORM Configuration
# ------------------------------------------------------------------------------
# In development, 'update' creates/updates schema automatically. In production, use Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.festival.schedule=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
