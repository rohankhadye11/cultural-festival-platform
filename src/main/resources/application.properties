# ==============================================================================
# Automated Cultural Festival Schedule Platform (FestPulse)
# Core Application Properties - Phase 1 MVP Configuration
# ==============================================================================

# Application Identity
spring.application.name=cultural-festival-platform

# Embedded Tomcat Web Server Port
server.port=8080

# ------------------------------------------------------------------------------
# Database Configuration (PostgreSQL / In-Memory H2 Fallback for Containers)
# ------------------------------------------------------------------------------
# Defaults to standalone H2 in-memory PostgreSQL mode; overrides with env vars if provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:festival_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=FestPulseHikariPool

# ------------------------------------------------------------------------------
# Spring Data JPA & Hibernate ORM Configuration
# ------------------------------------------------------------------------------
# In development, 'update' creates/updates schema automatically. In production, use Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Logging Configuration
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.festival.schedule=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
