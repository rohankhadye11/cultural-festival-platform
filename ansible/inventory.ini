# ==============================================================================
# FestPulse Platform - Ansible Inventory (Task 13)
# Target Group: [production]
# ==============================================================================

[production]
# Local deployment target for containerized Ansible execution or local controller
localhost ansible_connection=local ansible_python_interpreter=auto_silent

# ------------------------------------------------------------------------------
# Remote Production Servers (Template for Cloud VM / Bare-Metal Deployments)
# ------------------------------------------------------------------------------
# To target a remote server, uncomment and configure your remote host details:
# prod-node-01 ansible_host=192.168.1.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/festpulse_key

[production:vars]
ansible_python_interpreter=auto_silent
environment_type=production
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
